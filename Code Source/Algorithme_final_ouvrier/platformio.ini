; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:xiaoble]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble
framework = arduino
monitor_speed = 115200

# 1. Chemins d'inclusion vers vos deux dossiers distincts
build_flags = 
    -I ../Librairie_PlatformIO/lib/MessageManager
    -I ../Librairie_PlatformIO/lib/UWBDataManager

# 2. On force la compilation locale des fichiers .cpp distants
build_src_filter =
    +<*>
    +<../Librairie_PlatformIO/lib/MessageManager/*.cpp>
    +<../Librairie_PlatformIO/lib/UWBDataManager/*.cpp>

# 3. Dépendances officielles (sans aucune logique de scan automatique)
lib_deps =
    adafruit/Adafruit BMP5xx Library
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO