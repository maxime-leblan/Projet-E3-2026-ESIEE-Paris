; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; On commente (ou supprime) les flags USB CDC qui forçaient la redirection interne
; build_flags = 
;     -D ARDUINO_USB_MODE=1
;     -D ARDUINO_USB_CDC_ON_BOOT=1

; On désactive le forçage DTR/RTS qui n'est plus nécessaire sur ce port
monitor_dtr = 0
monitor_rts = 0

; Ces 2 lignes servent uniquement à envoyer manuellement des messages au modules UWB
; ==> les mettre en commentaires s'il on a pas besoin de faire cela
monitor_echo = yes
monitor_filters = send_on_enter

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11