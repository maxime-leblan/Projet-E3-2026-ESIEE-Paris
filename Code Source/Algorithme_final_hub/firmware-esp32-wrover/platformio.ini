; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200

; Flag indispensable pour activer la RAM externe (PSRAM) du module WROVER
build_flags = 
    -DBOARD_HAS_PSRAM
    -I .pio/libdeps/esp-wrover-kit/ArduinoJson/src
    -I .pio/libdeps/esp-wrover-kit/ArduinoEigen
    -I .pio/libdeps/esp-wrover-kit/ArxTypeTraits
    -I lib/hubDataStorage
    -I lib/MessageManager
    -I lib/RecuperationDonneesAncres
    -I lib/InitAnchorPosition
    -I "../../Librairie_PlatformIO/lib/MessageManager"

build_src_filter =
    +<*>
    +<../lib/hubDataStorage/*.cpp>
    +<../lib/MessageManager/*.cpp>
    +<../lib/RecuperationDonneesAncres/*.cpp>
    +<../lib/InitAnchorPosition/*.cpp>
    +<"../../Librairie_PlatformIO/lib/MessageManager/*.cpp">

lib_extra_dirs =
    ..
    ../..

lib_ignore =
    Essais_carte_MaUWB

lib_deps =
    hideakitai/ArduinoEigen
    bblanchon/ArduinoJson

; A retirer si on veut tester la librairie MessageManager
extra_scripts =
    pre:ignore_files.py