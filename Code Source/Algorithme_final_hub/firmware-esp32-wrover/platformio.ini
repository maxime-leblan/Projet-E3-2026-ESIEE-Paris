[env:esp-wrover-kit]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

lib_ldf_mode = deep+

lib_extra_dirs =
    ../../Librairie_PlatformIO/lib
    ../..  ; <-- INDISPENSABLE : Autorise PIO à trouver Algorithme-trilateration et librairie_hub

lib_deps =
    hideakitai/ArduinoEigen
    bblanchon/ArduinoJson
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit BusIO @ ^1.16.1
    SPI
    Wire
    
    ; --- Tes librairies partagées ---
    MessageManager
    UWBDataManager
    
    ; --- Tes librairies Mathématiques (Externes) ---
    Algorithme-trilateration
    ;librairie_hub   

build_flags = 
    -DBOARD_HAS_PSRAM

lib_ignore =
    Essais_carte_MaUWB

extra_scripts =
    pre:ignore_files.py