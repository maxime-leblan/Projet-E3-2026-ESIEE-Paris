; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; On désactive le forçage DTR/RTS qui n'est plus nécessaire sur ce port
monitor_dtr = 0
monitor_rts = 0

; Vitesse du moniteur :
monitor_speed = 115200

; =========================================
; GESTION PROFONDE DES DÉPENDANCES (Fix Adafruit)
; =========================================
lib_ldf_mode = deep+ 

lib_extra_dirs =
    ..
    ../..

lib_deps =
    Wire
    SPI
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.14.1
    Messages

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; Inclusions de tes librairies partagées EXTERNES uniquement
    -I "../../Librairie_PlatformIO/lib/MessageManager"
    -I "../../Librairie_PlatformIO/lib/UWBDataManager"
    
    ; /!\ SUPPRIME les lignes -I "lib/..." /!\
    ; PlatformIO inclut automatiquement le dossier lib/ de ton projet actuel.
    ; Forcer le chemin avec -I empêche le scanner (LDF) de faire son travail correctement.