; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; On désactive le forçage DTR/RTS qui n'est plus nécessaire sur ce port
monitor_dtr = 0
monitor_rts = 0

; Vitesse du moniteur :
monitor_speed = 115200

lib_ldf_mode = deep+ 

; 1. CORRECTION : On cible UNIQUEMENT ton dossier de librairies partagées. 
; On ne lui laisse plus fouiller tout le disque dur.
lib_extra_dirs =
    ../../Librairie_PlatformIO/lib

; 2. CORRECTION : On liste TOUTES les librairies pour forcer PlatformIO à les lier entre elles.
lib_deps =
    Wire
    SPI
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.14.1
    
    ; --- Tes librairies LOCALES (dans le dossier lib/ de l'ancre) ---
    Messages
    UWBModuleActions
    InitialisationProtocol
    
    ; --- Tes librairies PARTAGÉES (dans Librairie_PlatformIO/lib/) ---
    MessageManager
    UWBDataManager
    ; Ajoute ici le nom du dossier de UWBMessageManager s'il est différent

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; On supprime totalement les "-I". Puisqu'on a bien configuré lib_extra_dirs 
    ; et lib_deps, le compilateur va trouver les chemins d'inclusion tout seul et proprement !